<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Holocall — the closest thing to teleportation</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
  </head>
  <body>
    <div class="header">
      <h1>Holocall</h1>
      <div class="user-controls">
        <select id="qualitySelector" class="quality-selector" aria-label="Video quality">
          <option value="360">360p</option>
          <option value="720" selected>720p (HD)</option>
          <option value="1080">1080p (Full HD)</option>
        </select>
        <a href="/profile.html" id="userInfo" class="user-name" title="View profile"></a>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </div>

    <!-- navigation -->
    <nav class="main-nav">
      <a href="/my-people.html" class="nav-link">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        My People
      </a>
      <a href="/find-people.html" class="nav-link">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        Find People
      </a>
    </nav>

    <!-- top controls -->
    <div class="row controls">
      <input id="roomInput" placeholder="room name (e.g. arrakis)" autocomplete="off" />
      <button id="joinBtn" class="primary">Join</button>

      <!-- legacy buttons (hidden via CSS) -->
      <button id="leaveBtn" class="legacy-btn" disabled>Leave</button>
      <button id="muteBtn"  class="legacy-btn" disabled>Mute Mic</button>
      <button id="camBtn"   class="legacy-btn" disabled>Camera Off</button>
    </div>

    <!-- stage -->
    <div id="videos" aria-label="Call stage">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo"  autoplay playsinline muted class="muted"></video>

      <!-- floating bottom control bar -->
      <div class="control-bar" role="toolbar" aria-label="Call controls">
        <button id="muteIconBtn" class="icon-btn" aria-label="Toggle microphone" aria-pressed="true">
          <span class="visually-hidden">Mic</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <button id="cameraIconBtn" class="icon-btn" aria-label="Toggle camera" aria-pressed="true">
          <span class="visually-hidden">Camera</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 10.5V7a2 2 0 0 0-2-2H5A2 2 0 0 0 3 7v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
        <button id="leaveIconBtn" class="icon-btn danger" aria-label="Leave call">
          <span class="visually-hidden">Leave</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79a15.05 15.05 0 0 1 10.76 0l1.43.57a1 1 0 0 1 .6.92v3.12a1 1 0 0 1-1.38.93l-3.06-1.22a1 1 0 0 1-.62-.74L5 16.33a1 1 0 0 1-1.38-.93V12.28a1 1 0 0 1 .6-.92l1.43-.57z"/></svg>
        </button>
      </div>

      <!-- Holo Mode button (visible when a remote participant is present) -->
      <button id="holoBtn" class="holo-btn" hidden>Holo Mode</button>

      <!-- leave confirmation overlay -->
      <div id="confirmOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
        <div class="overlay-card" role="document">
          <h2 id="confirmTitle">leave the room?</h2>
          <div class="overlay-actions">
            <button id="confirmCancel" class="btn">cancel</button>
            <button id="confirmLeave"  class="btn danger">leave</button>
          </div>
        </div>
      </div>
    </div>

    <!-- hidden log -->
    <pre id="log"></pre>

    <!-- toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- hidden video for AR -->
    <video id="remoteHoloVideo" autoplay playsinline muted hidden></video>

    <!-- AR exit button -->
    <button id="arClose" class="ar-close" hidden aria-label="Exit AR">&times;</button>

    <!-- supabase client for realtime -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- external app script -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
