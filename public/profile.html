<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Profile - Holocall</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
  </head>
  <body class="auth-page">
    <div class="profile-container">
      <h1>Holocall</h1>
      <p class="auth-subtitle">Complete your profile</p>
      
      <form id="profileForm" class="profile-form">
        <div class="profile-picture-section">
          <div class="profile-picture-preview" id="picturePreview">
            <svg class="default-avatar" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="50" fill="#1a1a1a"/>
              <circle cx="50" cy="35" r="15" fill="#6d7480"/>
              <path d="M50 55c-12 0-22 8-25 18h50c-3-10-13-18-25-18z" fill="#6d7480"/>
            </svg>
            <img id="pictureImg" style="display: none;" alt="Profile preview" />
          </div>
          <label for="profilePicture" class="upload-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
            </svg>
            Upload Picture
          </label>
          <input 
            type="file" 
            id="profilePicture" 
            accept="image/jpeg,image/png,image/webp,image/gif"
            style="display: none;"
          />
          <p class="upload-hint">JPG, PNG, WebP or GIF (max 5MB)</p>
        </div>
        
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            id="username" 
            type="text" 
            placeholder="cooluser123" 
            required 
            minlength="3"
            maxlength="30"
            pattern="[a-zA-Z0-9_]+"
            autocomplete="username"
          />
          <small class="field-hint">3-30 characters, letters, numbers, and underscores only</small>
        </div>
        
        <div class="form-group">
          <label for="bio">Bio</label>
          <textarea 
            id="bio" 
            placeholder="Tell us about yourself..." 
            rows="4"
            maxlength="500"
          ></textarea>
          <small class="field-hint">Optional, max 500 characters</small>
        </div>
        
        <div class="form-group">
          <label for="tags">Interests</label>
          <input 
            id="tags" 
            type="text" 
            placeholder="gaming, music, tech, art" 
            autocomplete="off"
          />
          <small class="field-hint">Comma-separated tags (e.g., gaming, music, tech)</small>
        </div>
        
        <div id="error" class="error-message" role="alert"></div>
        
        <button type="submit" class="primary" id="saveBtn">Save Profile</button>
        
        <p class="auth-link">
          <a href="/" id="skipLink">Skip for now</a>
        </p>
      </form>
    </div>
    
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    
    <script type="module" src="/profile.js"></script>
  </body>
</html>
