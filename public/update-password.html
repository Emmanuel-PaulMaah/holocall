<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Update Password - Holocall</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <h1>Holocall</h1>
      <p class="auth-subtitle">Set a new password</p>
      
      <form id="updatePasswordForm" class="auth-form">
        <div class="form-group">
          <input 
            id="newPassword" 
            type="password" 
            placeholder="New Password" 
            required 
            autocomplete="new-password"
            minlength="6"
          />
        </div>
        
        <div class="form-group">
          <input 
            id="confirmPassword" 
            type="password" 
            placeholder="Confirm Password" 
            required 
            autocomplete="new-password"
            minlength="6"
          />
        </div>
        
        <div id="error" class="error-message" role="alert"></div>
        
        <button type="submit" class="primary" id="updateBtn">Update Password</button>
      </form>
    </div>
    
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    
    <script type="module" src="/auth.js"></script>
  </body>
</html>
