<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Find People - Holocall</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
  </head>
  <body class="auth-page">
    <div class="find-people-container">
      <div class="find-people-header">
        <h1>Find People</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
          <div class="badge-container">
            <a href="/friend-requests.html" class="back-btn" id="requestsLink">
              <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
              </svg>
              Requests
            </a>
            <span id="requestsBadge" class="notification-badge" style="display: none;">0</span>
          </div>
          <a href="/" class="back-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back
          </a>
        </div>
      </div>
      
      <div class="search-section">
        <div class="search-box">
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Search by username..." 
            autocomplete="off"
          />
          <button id="searchBtn" class="search-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
          </button>
        </div>
      </div>
      
      <div id="resultsContainer" class="results-container">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <p>Search for people to connect with</p>
          <small>Enter a username to find new friends</small>
        </div>
      </div>
    </div>
    
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    
    <script type="module" src="/find-people.js"></script>
  </body>
</html>
