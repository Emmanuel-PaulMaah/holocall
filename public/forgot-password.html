<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reset Password - Holocall</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <h1>Holocall</h1>
      <p class="auth-subtitle">Reset your password</p>
      
      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <input 
            id="email" 
            type="email" 
            placeholder="Email" 
            required 
            autocomplete="email"
          />
        </div>
        
        <div id="error" class="error-message" role="alert"></div>
        <div id="success" class="success-message" role="status"></div>
        
        <button type="submit" class="primary" id="resetBtn">Send Reset Link</button>
        
        <p class="auth-switch">
          Remember your password? <a href="/login.html">Login</a>
        </p>
      </form>
    </div>
    
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    
    <script type="module" src="/auth.js"></script>
  </body>
</html>
